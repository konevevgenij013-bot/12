<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Налоги просто — бухгалтерское обслуживание для микро и малого бизнеса. Ведём учёт, сдаём отчётность, считаем налоги. От 4 500 ₽/мес." />
    <meta name="keywords" content="бухгалтерия, налоги, аутсорсинг бухгалтерии, ИП, ООО, малый бизнес, отчётность" />
    <meta property="og:title" content="Налоги просто — бухгалтерия для малого бизнеса" />
    <meta property="og:description" content="Ведём учёт, сдаём отчётность, считаем налоги. Вы занимаетесь бизнесом — мы берём бухгалтерию на себя." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#BD9EE1" />

    <link rel="icon" type="image/webp" href="https://i.ibb.co/k24Psx5f/image.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Налоги просто — бухгалтерия для малого бизнеса</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #272E35;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>

    <script>
      (function () {
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        const isInIframe = window.self !== window.top;
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          applyThemeToDOM("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
